name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 tools/sync.py --check
      - run: python3 tools/release.py --verify
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements-dev.txt
      - name: Test with coverage
        run: |
          .venv/bin/coverage run -m unittest discover -s tests
          .venv/bin/coverage report --fail-under=90 | tee coverage.txt
          { echo '## Coverage'; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
